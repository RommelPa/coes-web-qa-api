name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/rommelpa/coes-web-qa-api

jobs:
  quality:
    name: Lint and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.17

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run lint
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  docker:
    name: Build, smoke test, and publish Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t coes-web-qa-api:ci .

      - name: Run container
        run: |
          docker run -d --name coes-web-qa-api-ci -p 8000:8000 coes-web-qa-api:ci
          sleep 8

      - name: Smoke test health endpoint
        run: curl --fail http://127.0.0.1:8000/health

      - name: Smoke test metadata endpoint
        run: curl --fail http://127.0.0.1:8000/metadata

      - name: Show container logs on failure
        if: failure()
        run: docker logs coes-web-qa-api-ci

      - name: Stop container
        if: always()
        run: docker rm -f coes-web-qa-api-ci

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag coes-web-qa-api:ci $IMAGE_NAME:sha-${{ github.sha }}
          docker tag coes-web-qa-api:ci $IMAGE_NAME:latest

      - name: Push Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE_NAME:sha-${{ github.sha }}
          docker push $IMAGE_NAME:latest